Organizations:

  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/coldchainrx.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &Manufacturer
    Name: ManufacturerMSP
    ID: ManufacturerMSP
    MSPDir: organizations/peerOrganizations/manufacturer.coldchainrx.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ManufacturerMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('ManufacturerMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('ManufacturerMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ManufacturerMSP.peer')"
    AnchorPeers:
      - Host: peer0.manufacturer.coldchainrx.com
        Port: 7051

  - &Distributor
    Name: DistributorMSP
    ID: DistributorMSP
    MSPDir: organizations/peerOrganizations/distributor.coldchainrx.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('DistributorMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('DistributorMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('DistributorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('DistributorMSP.peer')"
    AnchorPeers:
      - Host: peer0.distributor.coldchainrx.com
        Port: 8051

  - &Pharmacy
    Name: PharmacyMSP
    ID: PharmacyMSP
    MSPDir: organizations/peerOrganizations/pharmacy.coldchainrx.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PharmacyMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('PharmacyMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('PharmacyMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PharmacyMSP.peer')"
    AnchorPeers:
      - Host: peer0.pharmacy.coldchainrx.com
        Port: 9451


Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true

  Orderer: &OrdererCapabilities
    V2_0: true

  Application: &ApplicationCapabilities
    V2_5: true


Application: &ApplicationDefaults
  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"

  Capabilities:
    <<: *ApplicationCapabilities


Orderer: &OrdererDefaults
  OrdererType: etcdraft

  Addresses:
    - orderer.coldchainrx.com:7050

  EtcdRaft:
    Consenters:
      - Host: orderer.coldchainrx.com
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/coldchainrx.com/orderers/orderer.coldchainrx.com/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/coldchainrx.com/orderers/orderer.coldchainrx.com/tls/server.crt

  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB

  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

  Capabilities:
    <<: *OrdererCapabilities


Channel: &ChannelDefaults

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"

  Capabilities:
    <<: *ChannelCapabilities


Profiles:

  ColdChainRxChannel:
    <<: *ChannelDefaults
    Consortium: ColdChainRxConsortium
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Manufacturer
        - *Distributor
        - *Pharmacy

  ColdChainRxOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg

    Consortiums:
      ColdChainRxConsortium:
        Organizations:
          - *Manufacturer
          - *Distributor
          - *Pharmacy
